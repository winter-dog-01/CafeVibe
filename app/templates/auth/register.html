{% extends "base.html" %}
{% block title %}加入 CafeVibe{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 pt-20 pb-12">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-3xl shadow-xl shadow-coffee/8 p-8 md:p-10">
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-2 mb-6">
          <div class="w-10 h-10 rounded-full bg-brown flex items-center justify-center">
            <span class="text-cream font-serif font-bold">C</span>
          </div>
        </a>
        <h1 class="font-serif text-3xl font-bold text-coffee mb-2">加入 CafeVibe</h1>
        <p class="text-coffee/50 text-sm">開始你的質感跑咖之旅</p>
      </div>

      {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl mb-6">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/register" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-coffee/70 mb-2 uppercase tracking-wide">用戶名稱</label>
            <input type="text" name="username" required placeholder="cafevibe_user"
              class="w-full px-4 py-3.5 rounded-xl border border-brown/15 bg-cream text-coffee text-sm focus:outline-none focus:ring-2 focus:ring-caramel/30 focus:border-caramel transition-all placeholder-coffee/30" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-coffee/70 mb-2 uppercase tracking-wide">顯示名稱</label>
            <input type="text" name="display_name" placeholder="你的名字"
              class="w-full px-4 py-3.5 rounded-xl border border-brown/15 bg-cream text-coffee text-sm focus:outline-none focus:ring-2 focus:ring-caramel/30 focus:border-caramel transition-all placeholder-coffee/30" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-coffee/70 mb-2 uppercase tracking-wide">Email</label>
          <input type="email" name="email" required placeholder="your@email.com"
            class="w-full px-4 py-3.5 rounded-xl border border-brown/15 bg-cream text-coffee text-sm focus:outline-none focus:ring-2 focus:ring-caramel/30 focus:border-caramel transition-all placeholder-coffee/30" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-coffee/70 mb-2 uppercase tracking-wide">密碼</label>
          <input type="password" name="password" required placeholder="至少 8 個字元"
            class="w-full px-4 py-3.5 rounded-xl border border-brown/15 bg-cream text-coffee text-sm focus:outline-none focus:ring-2 focus:ring-caramel/30 focus:border-caramel transition-all placeholder-coffee/30" />
        </div>
        <button type="submit" class="btn-primary w-full text-center py-4 text-sm mt-2">
          建立帳號，開始探索 →
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-brown/8 text-center">
        <p class="text-coffee/50 text-sm">
          已有帳號？
          <a href="/login" class="text-brown font-semibold hover:text-caramel transition-colors">登入</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
