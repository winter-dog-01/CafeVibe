{% extends "base.html" %}
{% block title %}登入 — CafeVibe{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 pt-20 pb-12">
  <div class="w-full max-w-md">
    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-xl shadow-coffee/8 p-8 md:p-10">
      <div class="text-center mb-8">
        <a href="/" class="inline-flex items-center gap-2 mb-6 group">
          <div class="w-10 h-10 rounded-full bg-brown flex items-center justify-center">
            <span class="text-cream font-serif font-bold">C</span>
          </div>
        </a>
        <h1 class="font-serif text-3xl font-bold text-coffee mb-2">歡迎回來</h1>
        <p class="text-coffee/50 text-sm">繼續你的跑咖旅程</p>
      </div>

      {% if error %}
      <div class="bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl mb-6">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold text-coffee/70 mb-2 uppercase tracking-wide">Email</label>
          <input type="email" name="email" required placeholder="your@email.com"
            class="w-full px-4 py-3.5 rounded-xl border border-brown/15 bg-cream text-coffee text-sm focus:outline-none focus:ring-2 focus:ring-caramel/30 focus:border-caramel transition-all placeholder-coffee/30" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-coffee/70 mb-2 uppercase tracking-wide">密碼</label>
          <input type="password" name="password" required placeholder="••••••••"
            class="w-full px-4 py-3.5 rounded-xl border border-brown/15 bg-cream text-coffee text-sm focus:outline-none focus:ring-2 focus:ring-caramel/30 focus:border-caramel transition-all placeholder-coffee/30" />
        </div>
        <button type="submit" class="btn-primary w-full text-center py-4 text-sm">
          登入
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-brown/8 text-center">
        <p class="text-coffee/50 text-sm">
          還沒有帳號？
          <a href="/register" class="text-brown font-semibold hover:text-caramel transition-colors">免費加入 CafeVibe</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
